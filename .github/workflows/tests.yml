name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ANARCI aligns sequences against antibody profile HMMs with HMMER.
      - run: sudo apt-get update && sudo apt-get install -y hmmer
      # The CPU build of PyTorch is far smaller than the default CUDA build,
      # and the tests never touch a GPU.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt && pip install -e .
      - run: pytest -v
